<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课文默写排版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: #f8fafc; color: #0f172a; }
      .sheet {
        background: #fff;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      .sheet-title {
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .panel-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .part-block { break-inside: avoid; margin-bottom: 18px; }
      .part-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 10px;
        padding-bottom: 4px;
        border-bottom: 1px solid #e2e8f0;
      }

      /* ── Flex row: number + content always on the same baseline ── */
      .row-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 13px;
        line-height: 1.6;
      }
      .row-no {
        flex-shrink: 0;
        width: 1.8em;
        text-align: right;
        color: #475569;
        font-weight: 600;
      }
      .row-body {
        flex: 1;
        min-width: 0;
      }

      /* Sentence mode */
      .zh-primary { color: #0f172a; font-weight: 500; }
      .en-sub     { font-size: 12px; color: #64748b; margin-top: 2px; line-height: 1.5; }
      .answer-rule {
        border-bottom: 1px solid #9ca3af;
        margin-top: 8px;
        height: 24px;
        width: 100%;
      }

      /* Poem / cloze mode */
      .poem-line {
        font-size: 13px;
        line-height: 1.8;
        white-space: pre-wrap;
      }
      .cloze-blank {
        display: inline-block;
        border-bottom: 1px solid #1e293b;
        min-width: 60px;
        padding: 0 4px;
        text-align: center;
        color: transparent;
        user-select: none;
      }
      .ref-highlight strong { font-weight: 800; }

      @media (max-width: 980px) {
        .two-col { grid-template-columns: 1fr; }
      }

      @media print {
        .no-print { display: none !important; }
        body { background: #fff; }
        main { max-width: none !important; padding: 0 !important; }
        .sheet {
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
        }
        .two-col { grid-template-columns: 1fr 1fr !important; gap: 10mm; }
        @page { margin: 12mm; }
      }
    </style>
  </head>
  <body class="min-h-screen">
    <header class="no-print sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 space-y-2">
      <div class="flex flex-wrap items-center gap-2">
        <h1 class="text-base font-semibold mr-2">📝 课文默写排版</h1>
        <button id="btnPrint" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">🖨️ 打印 / 导出 PDF</button>
        <button id="btnCopyRef" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">📋 复制参考单</button>
        <button id="btnCopyDict" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">📋 复制默写纸</button>
        <span id="status" class="text-xs text-slate-500" role="status" aria-live="polite">准备加载</span>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="flex items-center gap-1">标题
          <input id="titleInput" type="text" class="border border-slate-300 rounded px-2 py-1 w-72" placeholder="G5 Unit 1" />
        </label>
        <label class="flex items-center gap-2">上传 3 列 CSV
          <input id="fileInput" type="file" accept=".csv,text/csv" class="text-xs" />
        </label>

      </div>
    </header>

    <main class="max-w-[960px] mx-auto p-4 space-y-4">
      <div id="notice" class="hidden text-sm rounded border px-3 py-2"></div>
      <section id="sheet" class="sheet hidden">
        <h2 id="sheetTitle" class="sheet-title"></h2>
        <div class="two-col">
          <section>
            <h3 class="panel-title">Reference List（参考单）</h3>
            <div id="refPanel"></div>
          </section>
          <section>
            <h3 class="panel-title">Dictation Sheet（默写纸）</h3>
            <div id="dictPanel"></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const PARTS = [
        { key: 'cartoon_time', title: 'Part I. Cartoon time', mode: 'sentence' },
        { key: 'story_time', title: 'Part II. Story time', mode: 'sentence' },
        { key: 'rhyme_song', title: 'Part III. Rhyme / Song', mode: 'poem' }
      ];

      const statusEl = document.getElementById('status');
      const noticeEl = document.getElementById('notice');
      const titleInput = document.getElementById('titleInput');
      const fileInput = document.getElementById('fileInput');
      const sheetEl = document.getElementById('sheet');
      const sheetTitleEl = document.getElementById('sheetTitle');
      const refPanelEl = document.getElementById('refPanel');
      const dictPanelEl = document.getElementById('dictPanel');

      let rows = [];

      function qs(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function setStatus(message) {
        statusEl.textContent = message || '';
      }

      function showNotice(message, isError = false) {
        if (!message) {
          noticeEl.classList.add('hidden');
          noticeEl.textContent = '';
          return;
        }
        noticeEl.textContent = message;
        noticeEl.className = 'text-sm rounded border px-3 py-2 ' +
          (isError ? 'border-red-300 bg-red-50 text-red-700' : 'border-amber-300 bg-amber-50 text-amber-800');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function parseCsvTable(csvText) {
        const text = String(csvText || '').replace(/^\uFEFF/, '');
        const out = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i += 1;
              } else {
                inQuotes = false;
              }
            } else {
              field += ch;
            }
            continue;
          }

          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\n') {
            row.push(field);
            out.push(row);
            row = [];
            field = '';
          } else if (ch !== '\r') {
            field += ch;
          }
        }
        row.push(field);
        out.push(row);

        return out.filter((r) => r.some((cell) => String(cell || '').trim() !== ''));
      }

      function normalizeHeaderKey(value) {
        return String(value || '').trim().toLowerCase().replace(/[\s_/]+/g, '');
      }

      function normalizeSection(value) {
        const raw = String(value || '').trim().toLowerCase().replace(/[\s\-_/]+/g, '');
        if (!raw) return 'story_time';
        if (/story/.test(raw))         return 'story_time';
        if (/cartoon/.test(raw))       return 'cartoon_time';
        if (/rhyme|song|诗/.test(raw)) return 'rhyme_song';
        return 'story_time';
      }

      function parseDictationCsv(csvText) {
        const table = parseCsvTable(csvText);
        if (!table.length) return [];

        const headerRow = table[0].map((h) => String(h || '').trim());
        const normalizedHeader = headerRow.map((h) => normalizeHeaderKey(h));
        const headerMap = new Map(normalizedHeader.map((h, i) => [h, i]));
        const hasHeader =
          normalizedHeader.includes('板块') ||
          normalizedHeader.includes('section') ||
          normalizedHeader.includes('英文原句') ||
          normalizedHeader.includes('英文') ||
          normalizedHeader.includes('中文释义') ||
          normalizedHeader.includes('挖空词') ||
          normalizedHeader.includes('中文');

        const dataRows = hasHeader ? table.slice(1) : table;
        const idxSection = hasHeader ? (headerMap.get('板块') ?? headerMap.get('section') ?? 0) : 0;
        const idxText = hasHeader ? (headerMap.get('英文原句') ?? headerMap.get('英文') ?? headerMap.get('text') ?? 1) : 1;
        const idxZh = hasHeader ? (headerMap.get('中文释义') ?? headerMap.get('挖空词') ?? headerMap.get('中文') ?? headerMap.get('zh') ?? 2) : 2;

        const parsed = dataRows.map((row, i) => {
          const section = normalizeSection(row[idxSection]);
          const english = String(row[idxText] ?? '').trim();
          const chinese = String(row[idxZh] ?? '').trim();
          if (!english && !chinese) return null;
          return { id: i + 1, section, text: english, zh: chinese };
        }).filter(Boolean);

        /* Fallback: if no rows matched a non-default section → treat all as story_time */
        const nonDefault = parsed.filter((r) => r.section !== 'story_time').length;
        if (nonDefault === 0 && parsed.length) {
          parsed.forEach((r) => { r.section = 'story_time'; });
        }

        return parsed;
      }

      function splitPoemLines(text) {
        return String(text || '')
          .replace(/\r\n/g, '\n')
          .split('\n')
          .map((line) => line.trim())
          .filter(Boolean);
      }

      /* ── Cloze regex: matches [word] and 【word】 ── */
      const CLOZE_RE = /(?:\[|【)(.*?)(?:\]|】)/g;

      function hasCloze(text) {
        CLOZE_RE.lastIndex = 0;
        return CLOZE_RE.test(String(text || ''));
      }

      /** Reference HTML: strip brackets, bold + underline cloze word */
      function refClozeHtml(text) {
        return escapeHtml(String(text || '')).replace(
          CLOZE_RE,
          '<u class="ref-highlight"><strong>$1</strong></u>'
        );
      }

      /** Dictation HTML: replace bracket groups with per-word styled blank spans */
      function dictClozeHtml(text) {
        return escapeHtml(String(text || '')).replace(
          CLOZE_RE,
          function (_match, wordsInside) {
            const words = wordsInside.trim().split(/\s+/).filter(Boolean);
            return words
              .map(() => '<span class="inline-block border-b border-gray-800 min-w-[50px] mx-1">&nbsp;</span>')
              .join('');
          }
        );
      }

      /** Plain-text: replace brackets with per-word underscores */
      function dictClozePlain(text) {
        return String(text || '').replace(CLOZE_RE, function (_match, wordsInside) {
          const words = wordsInside.trim().split(/\s+/).filter(Boolean);
          return words.map(() => '___________').join(' ');
        });
      }

      /** Plain-text: strip brackets, keep word */
      function refClozePlain(text) {
        return String(text || '').replace(CLOZE_RE, '$1');
      }

      function getPartRows(partKey) {
        return rows.filter((row) => row.section === partKey);
      }

      function buildPanels() {
        const refHtml = [];
        const dictHtml = [];

        PARTS.forEach((part) => {
          const list = getPartRows(part.key);
          if (!list.length) return;

          const isPoem = part.mode === 'poem';

          refHtml.push('<section class="part-block">');
          refHtml.push('<h4 class="part-title">' + escapeHtml(part.title) + '</h4>');
          dictHtml.push('<section class="part-block">');
          dictHtml.push('<h4 class="part-title">' + escapeHtml(part.title) + '</h4>');

          list.forEach((row, idx) => {
            const no = idx + 1;
            const textHasCloze = isPoem || hasCloze(row.text);

            if (textHasCloze) {
              /* ── Cloze / Poem — NO chinese, NO answer-rule lines ── */
              const poemLines = splitPoemLines(row.text);

              refHtml.push(
                '<div class="row-item">' +
                  '<span class="row-no">' + no + '.</span>' +
                  '<div class="row-body">'
              );
              poemLines.forEach((line) => {
                refHtml.push('<div class="poem-line">' + refClozeHtml(line) + '</div>');
              });
              refHtml.push('</div></div>');

              dictHtml.push(
                '<div class="row-item">' +
                  '<span class="row-no">' + no + '.</span>' +
                  '<div class="row-body">'
              );
              poemLines.forEach((line) => {
                dictHtml.push('<div class="poem-line">' + dictClozeHtml(line) + '</div>');
              });
              dictHtml.push('</div></div>');

            } else {
              /* ── Sentence mode (Story / Cartoon) ── */
              const zhSafe = row.zh ? escapeHtml(row.zh) : '';
              const enSafe = escapeHtml(row.text || '');

              /* Reference: 有中文 → 中文(主) + 英文(副)；无中文 → 仅英文 */
              const refBody = zhSafe
                ? '<div class="zh-primary">' + zhSafe + '</div>' +
                  '<div class="en-sub">' + enSafe + '</div>'
                : '<div class="zh-primary">' + enSafe + '</div>';

              refHtml.push(
                '<div class="row-item">' +
                  '<span class="row-no">' + no + '.</span>' +
                  '<div class="row-body">' + refBody + '</div>' +
                '</div>'
              );

              /* Dictation: 有中文 → 中文提示 + 横线；无中文 → 仅横线 */
              const dictBody = (zhSafe
                ? '<div class="zh-primary">' + zhSafe + '</div>'
                : '') +
                '<div class="answer-rule"></div>';

              dictHtml.push(
                '<div class="row-item">' +
                  '<span class="row-no">' + no + '.</span>' +
                  '<div class="row-body">' + dictBody + '</div>' +
                '</div>'
              );
            }
          });

          refHtml.push('</section>');
          dictHtml.push('</section>');
        });

        refPanelEl.innerHTML = refHtml.join('');
        dictPanelEl.innerHTML = dictHtml.join('');
      }

      function render() {
        const title = titleInput.value.trim() || '课文默写';
        sheetTitleEl.textContent = title;

        if (!rows.length) {
          sheetEl.classList.add('hidden');
          showNotice('请先通过 URL 传入 csv 参数，或上传 3 列 CSV（板块, 英文原句, 中文释义/挖空词）。', true);
          return;
        }

        showNotice('');
        buildPanels();
        sheetEl.classList.remove('hidden');
        setStatus('渲染完成：' + rows.length + ' 条。');
      }

      function buildCopyText(kind) {
        const out = [];
        const title = titleInput.value.trim() || '课文默写';
        out.push('【' + (kind === 'ref' ? 'Reference List' : 'Dictation Sheet') + '】' + title);

        PARTS.forEach((part) => {
          const list = getPartRows(part.key);
          if (!list.length) return;
          const isPoem = part.mode === 'poem';

          out.push('');
          out.push(part.title);

          list.forEach((row, idx) => {
            const no = idx + 1;
            const textHasCloze = isPoem || hasCloze(row.text);

            if (textHasCloze) {
              /* Cloze / Poem */
              const poemLines = splitPoemLines(row.text);
              poemLines.forEach((line, li) => {
                const prefix = li === 0 ? (no + '. ') : '   ';
                out.push(prefix + (kind === 'ref' ? refClozePlain(line) : dictClozePlain(line)));
              });
            } else {
              /* Sentence */
              if (kind === 'ref') {
                if (row.zh) {
                  out.push(no + '. ' + row.zh);
                  out.push('   ' + (row.text || ''));
                } else {
                  out.push(no + '. ' + (row.text || ''));
                }
              } else {
                if (row.zh) {
                  out.push(no + '. ' + row.zh);
                }
                out.push((row.zh ? '   ' : no + '. ') + '____________________________________');
              }
            }
          });
        });

        return out.join('\n').trim();
      }

      async function copyText(text, label) {
        try {
          await navigator.clipboard.writeText(text);
          setStatus(label + '已复制到剪贴板。');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setStatus(label + '已复制到剪贴板。');
        }
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ''));
          reader.onerror = () => reject(reader.error || new Error('读取失败'));
          reader.readAsText(file, 'utf-8');
        });
      }

      async function onFileChange(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        setStatus('正在读取 CSV...');
        try {
          const csvText = await readFileAsText(file);
          rows = parseDictationCsv(csvText);
          render();
        } catch (error) {
          showNotice('CSV 解析失败：' + String(error?.message || error), true);
          setStatus('');
        }
      }

      function initFromUrl() {
        const titleParam = qs('title');
        const csvParam = qs('csv');

        if (titleParam) titleInput.value = String(titleParam);
        if (!csvParam) {
          render();
          setStatus('等待上传 CSV。');
          return;
        }

        setStatus('正在从 URL 加载...');
        try {
          rows = parseDictationCsv(String(csvParam));
          render();
        } catch (error) {
          rows = [];
          showNotice('URL CSV 解析失败：' + String(error?.message || error), true);
          setStatus('');
        }
      }

      document.getElementById('btnPrint').addEventListener('click', () => window.print());

      document.getElementById('btnCopyRef').addEventListener('click', () => copyText(buildCopyText('ref'), '参考单'));
      document.getElementById('btnCopyDict').addEventListener('click', () => copyText(buildCopyText('dict'), '默写纸'));
      titleInput.addEventListener('change', render);
      fileInput.addEventListener('change', onFileChange);

      window.addEventListener('DOMContentLoaded', initFromUrl);
    </script>
  </body>
</html>
