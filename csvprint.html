<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一键排版打印</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: #f6f7f9; }
      .sheet {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
        padding: 24px;
      }
      .sheet-title { font-size: 22px; line-height: 1.25; font-weight: 700; text-align: center; letter-spacing: 0.02em; margin-bottom: 8px; }
      .sheet-meta { font-size: 12px; color: #64748b; text-align: center; margin-bottom: 14px; }

      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .panel { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 14px 10px; background: #fff; }
      .panel-title { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; letter-spacing: 0.02em; }

      .block { break-inside: avoid; margin-bottom: 10px; }
      .block h3 {
        margin: 12px 0 6px;
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
      }

      table.pt { border-collapse: collapse; width: 100%; table-layout: fixed; }
      table.pt th, table.pt td {
        border-bottom: 1px solid #e2e8f0;
        padding: 7px 8px;
        font-size: 13px;
        vertical-align: top;
      }
      table.pt th {
        background: #f8fafc;
        color: #334155;
        text-align: left;
        font-weight: 600;
      }
      table.pt td.center { text-align: center; white-space: nowrap; width: 4.5em; }
      .answer-cell { min-width: 9em; height: 1.9em; border-bottom: 1px solid #cbd5e1; }
      .ext-mark { color: #2563eb; font-weight: 600; }

      @media (max-width: 980px) {
        .duo { grid-template-columns: 1fr; }
      }

      @media print {
        .no-print { display: none !important; }
        body { background: #fff; }
        main { padding: 0 !important; max-width: none !important; }
        .sheet {
          box-shadow: none !important;
          border: none !important;
          margin: 0 !important;
          padding: 0 !important;
          border-radius: 0 !important;
          page-break-after: always;
        }
        .sheet:last-child { page-break-after: auto; }
        .duo { grid-template-columns: 1fr 1fr !important; gap: 10mm; }
        .panel { border-color: #e2e8f0; }
        @page { margin: 12mm; }
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800">
    <header class="no-print sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 space-y-2">
      <div class="flex flex-wrap items-center gap-2">
        <h1 class="text-base font-semibold mr-2">📄 排版打印</h1>
        <button id="btnPrint" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">🖨️ 打印 / 导出 PDF</button>
        <button id="btnCopyRef" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">📋 复制参考单</button>
        <button id="btnCopyDict" type="button" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">📋 复制默写纸</button>
        <button id="btnSaveCsv" type="button" class="px-3 py-1.5 text-sm rounded border border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100">💾 存 CSV</button>
        <a href="/dashboard.html" class="px-3 py-1.5 text-sm rounded border border-slate-300 bg-white hover:bg-slate-50">返回汇总</a>
        <span id="status" class="text-xs text-slate-500" role="status" aria-live="polite">准备加载</span>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="flex items-center gap-1">单元大标题
          <input id="titleInput" type="text" class="border border-slate-300 rounded px-2 py-1 w-56" placeholder="G5 Unit 1" />
        </label>
        <label class="flex items-center gap-1">页码分组（如 8-10, 11-13）
          <input id="groupInput" type="text" class="border border-slate-300 rounded px-2 py-1 w-72" placeholder="留空则合并为一页" />
        </label>
        <button id="btnRender" type="button" class="px-3 py-1.5 text-sm rounded border border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100">⚡ 重新排版</button>
      </div>
    </header>

    <main class="max-w-[900px] mx-auto p-4 space-y-6">
      <div id="notice" class="hidden text-sm rounded border px-3 py-2"></div>
      <div id="sheets" class="space-y-6"></div>
    </main>

    <script>
      const TYPE_ORDER = ['core_word', 'ext_word', 'core_phrase', 'ext_phrase', 'core_sentence', 'ext_sentence'];
      const TYPE_LABEL = {
        core_word: '核心单词',
        ext_word: '*拓展单词',
        core_phrase: '核心词组',
        ext_phrase: '*拓展词组',
        core_sentence: '核心句',
        ext_sentence: '*拓展句'
      };

      const sheetsEl = document.getElementById('sheets');
      const noticeEl = document.getElementById('notice');
      const statusEl = document.getElementById('status');
      const titleInput = document.getElementById('titleInput');
      const groupInput = document.getElementById('groupInput');

      let share = null;
      let rows = [];

      function qs(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function setStatus(message) {
        statusEl.textContent = message || '';
      }

      function showNotice(message, isError) {
        if (!message) {
          noticeEl.classList.add('hidden');
          noticeEl.textContent = '';
          return;
        }
        noticeEl.textContent = message;
        noticeEl.className = 'text-sm rounded border px-3 py-2 ' +
          (isError ? 'border-red-300 bg-red-50 text-red-700' : 'border-amber-300 bg-amber-50 text-amber-800');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function typeIndex(pen) {
        const i = TYPE_ORDER.indexOf(String(pen || ''));
        return i >= 0 ? i : 99;
      }

      function parseCsvTable(csvText) {
        const text = String(csvText || '').replace(/^\uFEFF/, '');
        const out = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i += 1;
              } else {
                inQuotes = false;
              }
            } else {
              field += ch;
            }
            continue;
          }

          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\n') {
            row.push(field);
            out.push(row);
            row = [];
            field = '';
          } else if (ch !== '\r') {
            field += ch;
          }
        }
        row.push(field);
        out.push(row);

        return out.filter((r) => r.some((cell) => String(cell || '').trim() !== ''));
      }

      function normalizeType(rawType) {
        const t = String(rawType || '').trim();
        if (!t) return '';
        if (TYPE_ORDER.includes(t)) return t;

        const byLabel = Object.entries(TYPE_LABEL).find(([, label]) => label === t);
        if (byLabel) return byLabel[0];

        if (t.includes('核心') && t.includes('单词')) return 'core_word';
        if (t.includes('拓展') && t.includes('单词')) return 'ext_word';
        if (t.includes('核心') && t.includes('词组')) return 'core_phrase';
        if (t.includes('拓展') && t.includes('词组')) return 'ext_phrase';
        if (t.includes('核心') && t.includes('句')) return 'core_sentence';
        if (t.includes('拓展') && t.includes('句')) return 'ext_sentence';
        return t;
      }

      function parseRowsFromCsvText(csvText) {
        const table = parseCsvTable(csvText);
        if (!table.length) return [];

        const headerRow = table[0].map((h) => String(h || '').trim());
        const headerMap = new Map(headerRow.map((h, i) => [h, i]));
        const hasHeader = headerMap.has('类型') || headerMap.has('英文') || headerMap.has('中文');
        const dataRows = hasHeader ? table.slice(1) : table;

        const idxType = hasHeader ? (headerMap.get('类型') ?? headerMap.get('type')) : 0;
        const idxOrder = hasHeader ? (headerMap.get('序号') ?? headerMap.get('编号')) : 1;
        const idxText = hasHeader ? (headerMap.get('英文') ?? headerMap.get('英文原文') ?? headerMap.get('text')) : 2;
        const idxZh = hasHeader ? (headerMap.get('中文') ?? headerMap.get('中文翻译') ?? headerMap.get('zh')) : 3;
        const idxPage = hasHeader ? (headerMap.get('页码') ?? headerMap.get('pageNum') ?? headerMap.get('page')) : -1;

        return dataRows.map((r, i) => {
          const text = String(r[idxText] ?? '').trim();
          const zh = String(r[idxZh] ?? '').trim();
          const rawType = String(r[idxType] ?? '').trim();
          const pen = normalizeType(rawType);
          const manualOrder = Number(r[idxOrder]);
          const pageNum = idxPage >= 0 ? Number(r[idxPage]) : NaN;
          return {
            pen,
            text,
            zh,
            manualOrder: Number.isFinite(manualOrder) ? manualOrder : i + 1,
            pageNum: Number.isFinite(pageNum) ? pageNum : null,
            createdAt: i + 1
          };
        }).filter((r) => r.text || r.zh || r.pen);
      }

      async function load() {
        const key = qs('key');
        const csvParam = qs('csv');
        const titleParam = qs('title');
        const groupsParam = qs('groups');

        setStatus('正在加载...');
        try {
          if (csvParam) {
            const csvText = String(csvParam || '');
            share = { csvText, title: titleParam || '' };
            rows = parseRowsFromCsvText(csvText);
            if (!titleInput.value) titleInput.value = titleParam || 'Unit';
            if (!groupInput.value) groupInput.value = groupsParam || '';
            setStatus('已从 URL 加载 ' + rows.length + ' 条');
            showNotice('');
            render();
            return;
          }

          if (!key) {
            showNotice('缺少 key 或 csv 参数：请从汇总页点击「一键导出排版」进入本页。', true);
            setStatus('');
            return;
          }

          const response = await fetch('/api/share-csv?key=' + encodeURIComponent(key) + '&format=json', { cache: 'no-store' });
          const payload = await response.json();
          if (!response.ok || !payload?.ok) {
            throw new Error(payload?.error || 'HTTP ' + response.status);
          }
          share = payload;
          rows = Array.isArray(payload.annotations) ? payload.annotations : [];
          if (!titleInput.value) titleInput.value = titleParam || payload.title || ('Unit ' + payload.unit);
          if (!groupInput.value) groupInput.value = groupsParam || '';
          setStatus('已加载 ' + rows.length + ' 条（Unit ' + payload.unit + '）');
          showNotice('');
          render();
        } catch (error) {
          setStatus('');
          showNotice('加载失败：' + String(error?.message || error), true);
        }
      }

      function parseGroups(spec) {
        const text = String(spec || '').trim();
        // 关键修复：分组为空时 = 全量，不做任何页码过滤
        if (!text) {
          return [null];
        }

        const parsed = text
          .split(/[,，;；\s]+/)
          .map((token) => token.trim())
          .filter(Boolean)
          .map((token) => {
            const range = token.match(/^(\d+)\s*[-~～]\s*(\d+)$/);
            if (range) {
              const a = Number(range[1]);
              const b = Number(range[2]);
              return [Math.min(a, b), Math.max(a, b)];
            }
            const single = Number(token);
            return Number.isFinite(single) ? [single, single] : null;
          })
          .filter(Boolean);

        // 输入存在但无法解析时返回空，交给上层提示
        return parsed;
      }

      function rowsInGroup(rs, group) {
        const filtered = !group
          ? rs.slice()
          : rs.filter((r) => {
              const [a, b] = group;
              const p = Number(r.pageNum);
              return Number.isFinite(p) && p >= a && p <= b;
            });

        return filtered.sort((x, y) => {
          const px = Number(x.pageNum) || 0;
          const py = Number(y.pageNum) || 0;
          if (px !== py) return px - py;
          const tx = typeIndex(x.pen);
          const ty = typeIndex(y.pen);
          if (tx !== ty) return tx - ty;
          const mx = Number.isFinite(Number(x.manualOrder)) ? Number(x.manualOrder) : Number.MAX_SAFE_INTEGER;
          const my = Number.isFinite(Number(y.manualOrder)) ? Number(y.manualOrder) : Number.MAX_SAFE_INTEGER;
          if (mx !== my) return mx - my;
          return Number(x.createdAt || 0) - Number(y.createdAt || 0);
        });
      }

      const CATEGORY_CONFIG = [
        { title: 'I. Words', core: 'core_word', ext: 'ext_word' },
        { title: 'II. Phrases', core: 'core_phrase', ext: 'ext_phrase' },
        { title: 'III. Sentences', core: 'core_sentence', ext: 'ext_sentence' }
      ];

      function rangeLabel(group) {
        if (!group) return 'All Pages';
        const [a, b] = group;
        return a === b ? 'Page ' + a : 'Pages ' + a + '-' + b;
      }

      function buildCategoryItems(list, coreType, extType) {
        const coreItems = list.filter((r) => String(r.pen || '') === coreType);
        const extItems = list.filter((r) => String(r.pen || '') === extType);
        let seq = 0;
        const out = [];

        coreItems.forEach((r) => {
          seq += 1;
          out.push({ row: r, no: String(seq), isExt: false });
        });
        extItems.forEach((r) => {
          seq += 1;
          out.push({ row: r, no: '*' + String(seq), isExt: true });
        });

        return out;
      }

      function buildCategoryGroups(list) {
        return CATEGORY_CONFIG
          .map((cfg) => ({
            title: cfg.title,
            items: buildCategoryItems(list, cfg.core, cfg.ext)
          }))
          .filter((g) => g.items.length > 0);
      }

      function buildPanelHtml(kind, groups) {
        const panelTitle = kind === 'ref' ? 'Reference List' : 'Dictation Sheet';
        let html = '<section class="panel"><h3 class="panel-title">' + escapeHtml(panelTitle) + '</h3>';

        for (const group of groups) {
          html += '<div class="block">';
          html += '<h3>' + escapeHtml(group.title) + '</h3>';
          html += '<table class="pt"><thead><tr>';
          if (kind === 'ref') {
            html += '<th style="width:4.5em;">No.</th><th>English</th><th>Chinese</th>';
          } else {
            html += '<th style="width:4.5em;">No.</th><th>Chinese Prompt</th><th>English</th>';
          }
          html += '</tr></thead><tbody>';

          group.items.forEach((item) => {
            const numClass = item.isExt ? 'center ext-mark' : 'center';
            if (kind === 'ref') {
              html += '<tr>' +
                '<td class="' + numClass + '">' + escapeHtml(item.no) + '</td>' +
                '<td>' + escapeHtml(item.row.text || '') + '</td>' +
                '<td>' + escapeHtml(item.row.zh || '') + '</td>' +
                '</tr>';
            } else {
              html += '<tr>' +
                '<td class="' + numClass + '">' + escapeHtml(item.no) + '</td>' +
                '<td>' + escapeHtml(item.row.zh || '') + '</td>' +
                '<td class="answer-cell"></td>' +
                '</tr>';
            }
          });

          html += '</tbody></table></div>';
        }

        html += '</section>';
        return html;
      }

      function buildSpreadSheet({ title, group, groups }) {
        const sheet = document.createElement('section');
        sheet.className = 'sheet';

        const meta = '<div class="sheet-meta">' + escapeHtml(rangeLabel(group)) + '</div>';
        sheet.innerHTML =
          '<h2 class="sheet-title">' + escapeHtml(title) + '</h2>' +
          meta +
          '<div class="duo">' +
          buildPanelHtml('ref', groups) +
          buildPanelHtml('dict', groups) +
          '</div>';

        return sheet;
      }

      function render() {
        const title = titleInput.value.trim() || 'Unit';
        const groups = parseGroups(groupInput.value);
        sheetsEl.innerHTML = '';

        if (!rows.length) {
          showNotice('当前分享没有标注数据。', true);
          return;
        }
        if (!groups.length) {
          showNotice('分组规则没有解析出任何页码，请检查输入（如 8-10, 11-13）。', true);
          return;
        }
        showNotice('');

        let rendered = 0;
        for (const group of groups) {
          const list = rowsInGroup(rows, group);
          if (!list.length) continue;
          const catGroups = buildCategoryGroups(list);
          if (!catGroups.length) continue;
          rendered += 1;
          sheetsEl.appendChild(buildSpreadSheet({ title, group, groups: catGroups }));
        }
        setStatus('排版完成：' + rendered + ' 组，共 ' + sheetsEl.childElementCount + ' 页。');
      }

      function buildCopyText(kind) {
        const title = titleInput.value.trim() || 'Unit';
        const groups = parseGroups(groupInput.value);
        const lines = [];

        for (const group of groups) {
          const list = rowsInGroup(rows, group);
          if (!list.length) continue;
          const catGroups = buildCategoryGroups(list);
          if (!catGroups.length) continue;

          lines.push('【' + (kind === 'ref' ? 'Reference List' : 'Dictation Sheet') + '】' + title);
          lines.push('(' + rangeLabel(group) + ')');

          for (const cat of catGroups) {
            lines.push('■ ' + cat.title);
            cat.items.forEach((item) => {
              if (kind === 'ref') {
                lines.push(item.no + '. ' + (item.row.text || '') + '　' + (item.row.zh || ''));
              } else {
                lines.push(item.no + '. ' + (item.row.zh || '') + '　____________');
              }
            });
          }
          lines.push('');
        }

        return lines.join('\n');
      }

      async function copyText(text, label) {
        try {
          await navigator.clipboard.writeText(text);
          setStatus(label + '已复制到剪贴板。');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setStatus(label + '已复制到剪贴板。');
        }
      }

      function saveCsv() {
        if (!share?.csvText) {
          setStatus('没有可保存的 CSV。');
          return;
        }
        const csvText = '\uFEFF' + share.csvText.replace(/^\uFEFF/, '');
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        const rawName = (titleInput.value.trim() || 'export').replace(/[\\/:*?"<>|]/g, '_');
        link.href = url;
        link.download = rawName + '.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setStatus('CSV 已保存。');
      }

      document.getElementById('btnRender').addEventListener('click', render);
      titleInput.addEventListener('change', render);
      groupInput.addEventListener('change', render);
      document.getElementById('btnPrint').addEventListener('click', () => window.print());
      document.getElementById('btnCopyRef').addEventListener('click', () => copyText(buildCopyText('ref'), '参考单'));
      document.getElementById('btnCopyDict').addEventListener('click', () => copyText(buildCopyText('dict'), '默写纸'));
      document.getElementById('btnSaveCsv').addEventListener('click', saveCsv);

      load();

    </script>
  </body>
</html>
