<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>标注 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <main class="max-w-4xl mx-auto p-4 space-y-4">
      <header class="flex items-center gap-3 flex-wrap">
        <h1 class="text-lg font-semibold">公开 Dashboard</h1>
        <label class="text-sm">Unit:</label>
        <select id="unitSelect" class="border rounded px-2 py-1 text-sm"></select>
        <button id="refreshBtn" class="px-3 py-1 text-sm rounded border bg-white">刷新</button>
        <a id="downloadBtn" class="px-3 py-1 text-sm rounded border bg-emerald-50 border-emerald-300 text-emerald-700" href="#">下载 CSV</a>
        <span id="status" class="text-xs text-slate-500"></span>
      </header>

      <section class="bg-white border rounded p-3">
        <div class="text-sm mb-2">总数：<span id="total">0</span></div>
        <pre id="summary" class="text-xs bg-slate-50 border rounded p-2 overflow-auto"></pre>
      </section>

      <section class="bg-white border rounded p-3">
        <h2 class="text-sm font-medium mb-2">明细（前 200 条）</h2>
        <div class="overflow-auto max-h-[60vh]">
          <table class="min-w-full text-xs">
            <thead class="bg-slate-100">
              <tr>
                <th class="text-left p-2">id</th>
                <th class="text-left p-2">pen</th>
                <th class="text-left p-2">pageNum</th>
                <th class="text-left p-2">text</th>
                <th class="text-left p-2">zh</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const units = [1, 2, 3, 4, 5, 6, 7, 8];
      const unitSelect = document.getElementById('unitSelect');
      const statusEl = document.getElementById('status');
      const totalEl = document.getElementById('total');
      const summaryEl = document.getElementById('summary');
      const rowsEl = document.getElementById('rows');
      const downloadBtn = document.getElementById('downloadBtn');

      for (const u of units) {
        const opt = document.createElement('option');
        opt.value = String(u);
        opt.textContent = `Unit ${u}`;
        unitSelect.appendChild(opt);
      }

      async function load() {
        const unit = Number(unitSelect.value || '1');
        statusEl.textContent = '加载中...';
        downloadBtn.href = `/api/export-csv?unit=${encodeURIComponent(String(unit))}`;
        try {
          const res = await fetch(`/api/annotations?unit=${encodeURIComponent(String(unit))}`, { cache: 'no-store' });
          const payload = await res.json();
          if (!res.ok || !payload?.ok) {
            throw new Error(payload?.error || `HTTP ${res.status}`);
          }

          totalEl.textContent = String(payload.total || 0);
          summaryEl.textContent = JSON.stringify({ unit: payload.unit, byPen: payload.byPen || {}, updatedAt: payload.updatedAt || null }, null, 2);

          const rows = Array.isArray(payload.annotations) ? payload.annotations.slice(0, 200) : [];
          rowsEl.innerHTML = '';
          for (const row of rows) {
            const tr = document.createElement('tr');
            tr.className = 'border-b';
            tr.innerHTML = `
              <td class="p-2">${String(row?.id || '')}</td>
              <td class="p-2">${String(row?.pen || '')}</td>
              <td class="p-2">${Number(row?.pageNum || '')}</td>
              <td class="p-2">${String(row?.text || '').replace(/</g, '&lt;')}</td>
              <td class="p-2">${String(row?.zh || '').replace(/</g, '&lt;')}</td>
            `;
            rowsEl.appendChild(tr);
          }
          statusEl.textContent = `已加载 Unit ${unit}`;
        } catch (err) {
          statusEl.textContent = `加载失败：${String(err?.message || err)}`;
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', load);
      unitSelect.addEventListener('change', load);
      unitSelect.value = '1';
      load();
    </script>
  </body>
</html>
